name: Benchmark

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/benchmark*'
      - 'package.json'
      - '.github/workflows/benchmark.yml'

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: bun install --frozen-lockfile

      - run: npm run build

      # Cache demo fixtures
      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@v5
        with:
          path: tests/fixtures/*.dem
          key: test-fixtures-v2

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download test-fixtures/v2 -p "*.dem" -D tests/fixtures/ --repo ${{ github.repository }} || echo "No test fixtures release found, skipping benchmark"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run benchmark
        id: bench
        run: |
          DEMO=tests/fixtures/demo.dem
          if [ ! -s "$DEMO" ]; then
            echo "No demo file found, skipping benchmark"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          bun run benchmark "$DEMO" --runs 3 --markdown benchmark.md

      - name: Comment benchmark results on PR
        if: steps.bench.outputs.skipped != 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const benchmarkMd = fs.readFileSync('benchmark.md', 'utf8');
            const body = `${benchmarkMd.replace(/^# /, '## ')}\n\n---\n*Auto-generated by CI*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('## Benchmark Results') && c.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
