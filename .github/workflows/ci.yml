name: CI

on:
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: bun install --frozen-lockfile

      - run: npm run format:check
      - run: npm run typecheck

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: bun install --frozen-lockfile

      - run: npm run build
      - run: npm run test:node

      # Cache demo fixtures to avoid repeated downloads
      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@v5
        with:
          path: tests/fixtures/*.dem
          key: test-fixtures-v2

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download test-fixtures/v2 -p "*.dem" -D tests/fixtures/ --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - run: test -s tests/fixtures/demo.dem
      - run: bun run test

      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx tsc -p tests/browser/tsconfig.json
      - run: npx playwright test
